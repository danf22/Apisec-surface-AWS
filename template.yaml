AWSTemplateFormatVersion: "2010-09-09"
Description: >
  APIsec AI-Surface scanning pipeline. CodePipeline pulls a target GitHub repo
  through a CodeStar (GitHub) connection, CodeBuild runs apisec-inc/AI-Surface
  against it, and the generated HTML report (plus JSON / SARIF / CycloneDX AI-BOM
  evidence) is published to an S3 static-website bucket for the security team.

# ---------------------------------------------------------------------------
# NOTE on CodeDeploy:
#   ai-surface is an offline static analysis scanner. It produces a report; it
#   does not deploy a running application to compute (EC2/Lambda/ECS), which is
#   what the CodeDeploy service is for. The "deploy" step in this flow is the
#   publication of the report to S3, handled inside CodeBuild. See README.md.
# ---------------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: apisec-ai-surface
    Description: Name prefix applied to created resources.

  RepoOwner:
    Type: String
    Description: GitHub org/user that owns the repository to scan (e.g. apisec-inc).

  RepoName:
    Type: String
    Description: Repository name to scan (e.g. AI-Surface).

  RepoBranch:
    Type: String
    Default: main
    Description: Branch of the target repository to scan.

  FullRepositoryId:
    Type: String
    Description: >
      Full repository id in "owner/name" form used by the CodeStar connection
      source action (e.g. apisec-inc/AI-Surface).

  ExistingConnectionArn:
    Type: String
    Default: ""
    Description: >
      Optional. ARN of an existing CodeStar/CodeConnections GitHub connection.
      Leave blank to create a new connection (which must then be authorized once
      in the console: Developer Tools > Settings > Connections).

  FailOn:
    Type: String
    Default: never
    AllowedValues:
      - never
      - high
      - critical
    Description: >
      Severity that fails the build. "never" always publishes the report even
      when risks are found (recommended so the security team always gets a report).

  ReportRetentionDays:
    Type: Number
    Default: 365
    Description: Days to retain timestamped report objects in the reports bucket.

  BasicAuthUsername:
    Type: String
    Default: security
    MinLength: 1
    Description: >
      Username required to view reports through CloudFront (HTTP Basic Auth).

  BasicAuthPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >
      Password required to view reports through CloudFront (HTTP Basic Auth).
      Min 8 characters. Stored in the CloudFront Function code at deploy time;
      rotate by updating the stack with a new value.

  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Attach an AWS WAF web ACL to the CloudFront distribution. Adds an IP
      allowlist (if AllowedCidrs is set) and a rate-based rule. Default off.
      NOTE: this stack must be deployed in us-east-1 when EnableWaf=true,
      because CloudFront-scoped WAF resources are global (us-east-1 only).

  AllowedCidrs:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Comma-separated IPv4 CIDRs allowed to reach the reports (e.g.
      "203.0.113.0/24,198.51.100.10/32"). Only used when EnableWaf=true.
      Leave empty to allow all source IPs (rate limiting still applies).

  WafRateLimitPerFiveMin:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: >
      Max requests allowed from a single IP per 5-minute window before WAF
      blocks it (rate-based rule). Only used when EnableWaf=true.

Conditions:
  CreateConnection: !Equals [!Ref ExistingConnectionArn, ""]
  WafEnabled: !Equals [!Ref EnableWaf, "true"]
  # Apply the IP allowlist only when WAF is on AND at least one CIDR is provided.
  HasAllowedCidrs: !And
    - !Condition WafEnabled
    - !Not [!Equals [!Join ["", !Ref AllowedCidrs], ""]]

Resources:

  # ---------------------------------------------------------------------------
  # GitHub connection (only created when an existing ARN is not supplied)
  # ---------------------------------------------------------------------------
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Condition: CreateConnection
    Properties:
      ConnectionName: !Sub "${ProjectName}-gh"
      ProviderType: GitHub

  # ---------------------------------------------------------------------------
  # S3 buckets
  # ---------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30

  # Private bucket. It is NOT a public website and has no bucket-website config;
  # it is reachable only through the CloudFront distribution below via Origin
  # Access Control (OAC). All public access is blocked.
  ReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-timestamped-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: !Ref ReportRetentionDays

  # Bucket policy: allow read ONLY from this CloudFront distribution (OAC).
  # The SourceArn condition scopes access to exactly this distribution, so no
  # other principal (or other distribution) can read the objects.
  ReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ReportBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ReportDistribution}"

  # ---------------------------------------------------------------------------
  # CloudFront: the only way to reach the reports bucket
  # ---------------------------------------------------------------------------
  ReportOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-reports-oac"
        Description: OAC for the AI Surface reports bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Viewer-request function that does TWO things, in order:
  #   1. HTTP Basic Auth  — require a username/password before serving anything,
  #      so only the security team can view reports. Returns 401 (browser login
  #      prompt) when the Authorization header is missing or wrong. The expected
  #      credential is baked in at deploy time from stack parameters.
  #   2. Index rewrite     — map directory-style URLs (".../" or extension-less)
  #      to ".../index.html", since the OAC S3 REST origin does no index-document
  #      resolution itself.
  # A distribution can associate only one function per event type, so both live
  # here. Basic Auth is base64-over-HTTPS: reversible on its own, but the viewer
  # protocol policy forces HTTPS so credentials are not sent in the clear.
  ReportIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-auth-index"
      AutoPublish: true
      FunctionConfig:
        Comment: Basic Auth gate + index.html rewrite for AI Surface reports.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var headers = request.headers;

          // NOTE: the CloudFront Functions runtime is ES5.1-based. Avoid ES6
          // helpers like String.endsWith / Array.includes here (they raise a
          // runtime error -> 503). Use indexOf / substr instead.

          // ---- 1. HTTP Basic Auth ----
          // Use Buffer.from(...).toString("base64") for base64. (String.bytesFrom
          // is deprecated in the current runtime and raises a SyntaxError -> 503.)
          var user = "${BasicAuthUsername}";
          var pass = "${BasicAuthPassword}";
          var expected = "Basic " + Buffer.from(user + ":" + pass).toString("base64");

          var provided = (headers.authorization && headers.authorization.value) || "";
          if (provided !== expected) {
            return {
              statusCode: 401,
              statusDescription: "Unauthorized",
              headers: {
                "www-authenticate": { value: "Basic realm=\"AI Surface Reports\"" },
                "cache-control": { value: "no-store" }
              }
            };
          }

          // ---- 2. Index rewrite ----
          var uri = request.uri;
          var lastSlash = uri.lastIndexOf("/");
          var lastSegment = uri.substring(lastSlash + 1);
          if (uri.charAt(uri.length - 1) === "/") {
            request.uri = uri + "index.html";
          } else if (lastSegment.indexOf(".") === -1) {
            request.uri = uri + "/index.html";
          }
          return request;
        }

  # ---------------------------------------------------------------------------
  # Optional WAF (CloudFront scope = global; must be created in us-east-1)
  # ---------------------------------------------------------------------------
  ReportIPSet:
    Type: AWS::WAFv2::IPSet
    Condition: HasAllowedCidrs
    Properties:
      Name: !Sub "${ProjectName}-allowlist"
      Description: Source IPs allowed to reach the AI Surface reports.
      Scope: CLOUDFRONT
      IPAddressVersion: IPV4
      Addresses: !Ref AllowedCidrs

  ReportWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabled
    Properties:
      Name: !Sub "${ProjectName}-web-acl"
      Scope: CLOUDFRONT
      # Default DENY when an allowlist is configured (only listed IPs pass);
      # default ALLOW when no allowlist is set (rate limiting still applies).
      DefaultAction: !If
        - HasAllowedCidrs
        - Block: {}
        - Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-web-acl"
      Rules:
        # Rate limit every source IP (runs regardless of allowlist).
        - Name: RateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPerFiveMin
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-rate-limit"
        # Allow listed IPs (only present when an allowlist is configured).
        - !If
          - HasAllowedCidrs
          - Name: AllowListedIPs
            Priority: 1
            Action:
              Allow: {}
            Statement:
              IPSetReferenceStatement:
                Arn: !GetAtt ReportIPSet.Arn
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "${ProjectName}-allow-listed"
          - !Ref "AWS::NoValue"

  ReportDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        WebACLId: !If [WafEnabled, !GetAtt ReportWebACL.Arn, !Ref "AWS::NoValue"]
        Comment: !Sub "${ProjectName} AI Surface reports"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: ReportS3Origin
            DomainName: !GetAtt ReportBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ReportOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: ReportS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed "CachingOptimized" policy id.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ReportIndexFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html

  # ---------------------------------------------------------------------------
  # IAM roles
  # ---------------------------------------------------------------------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}*"
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: PublishReports
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ReportBucket.Arn
                  - !Sub "${ReportBucket.Arn}/*"
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ReportDistribution}"

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: StartBuild
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt ScanProject.Arn
              - Sid: UseConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !If
                  - CreateConnection
                  - !Ref GitHubConnection
                  - !Ref ExistingConnectionArn

  # ---------------------------------------------------------------------------
  # CodeBuild project: runs ai-surface and publishes the report to S3
  # ---------------------------------------------------------------------------
  ScanProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-scan"
      Description: Runs apisec-inc/AI-Surface against the source repo and publishes reports to S3.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: REPORT_BUCKET
            Value: !Ref ReportBucket
          - Name: REPO_NAME
            Value: !Ref RepoName
          - Name: REPO_OWNER
            Value: !Ref RepoOwner
          - Name: FAIL_ON
            Value: !Ref FailOn
          - Name: DISTRIBUTION_ID
            Value: !Ref ReportDistribution
      TimeoutInMinutes: 30
      Source:
        Type: CODEPIPELINE
        # Inlined so the build does NOT depend on a buildspec.yml inside the
        # scanned repo. The scanned repo is the CodePipeline source and would
        # not contain this file, so the build steps live here as the single
        # source of truth.
        BuildSpec: |
          version: 0.2
          env:
            variables:
              OUT_DIR: "ai-surface-out"
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo "Installing apisec-ai-surface..."
                - python -m pip install --upgrade pip
                - pip install apisec-ai-surface
                - ai-surface --help > /dev/null 2>&1 && echo "ai-surface installed" || true
            build:
              commands:
                - set -e
                - mkdir -p "$OUT_DIR"
                - export SCAN_TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                - export PREFIX="reports/${REPO_OWNER}/${REPO_NAME}/${SCAN_TS}"
                - echo "Scanning ${REPO_OWNER}/${REPO_NAME} at ${SCAN_TS}"

                # ai-surface labels the report with the BASENAME of the scan root
                # (a privacy feature). CodeBuild checks the source out into a
                # "src<random>" dir, which would show up as the project name. Copy
                # the source into a dir named after the repo so the map title reads
                # the real repo name (e.g. "yw-core") instead of "src".
                - export SCAN_DIR="/tmp/${REPO_NAME}"
                - mkdir -p "$SCAN_DIR"
                - cp -a . "$SCAN_DIR/"

                # Machine-readable evidence for download (kept alongside the UI).
                - ai-surface scan "$SCAN_DIR" --output json      > "$OUT_DIR/report.json"           || true
                - ai-surface scan "$SCAN_DIR" --output sarif     > "$OUT_DIR/report.sarif"          || true
                - ai-surface scan "$SCAN_DIR" --output cyclonedx > "$OUT_DIR/ai-bom.cyclonedx.json" || true

                # Build the SAME interactive UI that `ai-surface scan . --ui` serves
                # locally, but as a static bundle (index.html + app.js + styles.css +
                # report.json + ai-bom.json). We reuse the tool's own prepare_ui_dir()
                # so the output matches the loopback viewer exactly. No server needed:
                # the UI is pure client-side and fetches ./report.json.
                - |
                  python - <<'PY'
                  import os
                  from pathlib import Path
                  from ai_surface.orchestrator import Orchestrator, default_detectors
                  from ai_surface.ui_server import prepare_ui_dir

                  out_dir = Path(os.environ["OUT_DIR"])
                  scan_dir = os.environ.get("SCAN_DIR", ".")
                  report = Orchestrator(default_detectors()).run(scan_dir)
                  # Copies index.html/styles.css/app.js and writes report.json + ai-bom.json
                  prepare_ui_dir(report, dest=out_dir)
                  index = out_dir / "index.html"
                  assert index.is_file(), "UI bundle missing index.html"

                  # The UI shows an empty "scan a repo" form by default and only
                  # auto-loads report.json when the URL has ?demo / #demo (the
                  # local --ui server relies on its live /api/scan endpoint,
                  # which does not exist on a static S3 host). Inject a tiny
                  # bootstrap that sets #demo before app.js runs, so the hosted
                  # page lands directly on the populated map.
                  html = index.read_text(encoding="utf-8")
                  boot = (
                      '<script>if(!/(\\?|&)demo\\b/.test(location.search)'
                      '&&location.hash!=="#demo"){location.hash="#demo";}</script>'
                  )
                  marker = '<script src="./app.js"'
                  assert marker in html, "app.js script tag not found in index.html"
                  html = html.replace(marker, boot + "\n  " + marker, 1)
                  index.write_text(html, encoding="utf-8")

                  print("UI bundle ready:", sorted(p.name for p in out_dir.iterdir()))
                  PY

                # Publish: timestamped (immutable history) + latest (stable URL).
                - echo "Publishing interactive report to s3://${REPORT_BUCKET}/${PREFIX}/"
                - aws s3 cp "$OUT_DIR/" "s3://${REPORT_BUCKET}/${PREFIX}/" --recursive
                - aws s3 cp "$OUT_DIR/" "s3://${REPORT_BUCKET}/latest/${REPO_OWNER}/${REPO_NAME}/" --recursive
                # Also mirror to /latest/ so that path serves the newest report directly.
                - aws s3 cp "$OUT_DIR/" "s3://${REPORT_BUCKET}/latest/" --recursive

                # Root landing page: opening the CloudFront root (no path) serves
                # DefaultRootObject=index.html. Write one that redirects to the
                # latest report so the distribution auto-opens the map.
                - |
                  cat > /tmp/root-index.html <<HTML
                  <!doctype html><html><head><meta charset="utf-8">
                  <title>AI Surface Reports</title>
                  <meta http-equiv="refresh" content="0; url=./latest/${REPO_OWNER}/${REPO_NAME}/index.html#demo">
                  <link rel="canonical" href="./latest/${REPO_OWNER}/${REPO_NAME}/index.html">
                  </head><body>
                  Redirecting to the latest AI Surface report&hellip;
                  <a href="./latest/${REPO_OWNER}/${REPO_NAME}/index.html#demo">Open report</a>
                  </body></html>
                  HTML
                - aws s3 cp /tmp/root-index.html "s3://${REPORT_BUCKET}/index.html" --content-type "text/html"

                # Invalidate CloudFront so the new report is served immediately
                # instead of a cached copy of the previous run.
                - |
                  if [ -n "${DISTRIBUTION_ID}" ]; then
                    echo "Invalidating CloudFront distribution ${DISTRIBUTION_ID}..."
                    aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*" || true
                  fi

                # Optional severity gate, applied AFTER the report is published.
                - |
                  if [ "${FAIL_ON}" != "never" ]; then
                    echo "Re-running scan with --fail-on ${FAIL_ON} for the build gate..."
                    ai-surface scan "$SCAN_DIR" --fail-on "${FAIL_ON}"
                  else
                    echo "FAIL_ON=never; build always succeeds so the report is always available."
                  fi
          artifacts:
            base-directory: ai-surface-out
            files:
              - "**/*"

  # ---------------------------------------------------------------------------
  # CodePipeline: Source (GitHub via connection) -> Build (scan + publish)
  # ---------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !If
                  - CreateConnection
                  - !Ref GitHubConnection
                  - !Ref ExistingConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref RepoBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: ScanAndPublish
          Actions:
            - Name: AiSurfaceScan
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ScanProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ReportOutput

Outputs:
  ReportWebsiteUrl:
    Description: CloudFront URL for the reports. Opening it redirects to the latest report.
    Value: !Sub "https://${ReportDistribution.DomainName}/"

  LatestReportUrl:
    Description: Stable CloudFront URL the security team can bookmark for the most recent scan.
    Value: !Sub "https://${ReportDistribution.DomainName}/latest/index.html"

  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidation).
    Value: !Ref ReportDistribution

  WebACLArn:
    Condition: WafEnabled
    Description: ARN of the WAF web ACL attached to the distribution.
    Value: !GetAtt ReportWebACL.Arn

  ReportBucketName:
    Description: Reports bucket name (private; reachable only via CloudFront).
    Value: !Ref ReportBucket

  PipelineName:
    Description: CodePipeline name.
    Value: !Ref Pipeline

  ConnectionArn:
    Description: The GitHub connection ARN in use. Authorize it in the console if newly created.
    Value: !If [CreateConnection, !Ref GitHubConnection, !Ref ExistingConnectionArn]
