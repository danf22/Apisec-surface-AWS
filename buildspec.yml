version: 0.2

# NOTE: This file is the readable source-of-truth copy. CodeBuild does NOT read
# it from the scanned repo — the pipeline source IS the scanned repo, which does
# not contain this file. The effective buildspec is inlined in template.yaml
# (ScanProject.Source.BuildSpec). Keep the two in sync when editing.
#
# Runs apisec-inc/AI-Surface against the source repo checked out by CodePipeline,
# generates a web (HTML) report plus machine-readable evidence (JSON / SARIF /
# CycloneDX AI-BOM), and publishes everything to the reports S3 bucket under a
# timestamped prefix and a stable "latest/" prefix.
#
# Environment variables (set by the CloudFormation CodeBuild project):
#   REPORT_BUCKET  target S3 bucket for reports
#   REPO_OWNER     GitHub owner of the scanned repo (labeling only)
#   REPO_NAME      scanned repo name (labeling only)
#   FAIL_ON        never | high | critical  (never => always publish)

env:
  variables:
    OUT_DIR: "ai-surface-out"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing apisec-ai-surface..."
      - python -m pip install --upgrade pip
      - pip install apisec-ai-surface
      - ai-surface --help > /dev/null 2>&1 && echo "ai-surface installed" || true

  build:
    commands:
      - set -e
      - mkdir -p "$OUT_DIR"
      - export SCAN_TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
      - export PREFIX="reports/${REPO_OWNER}/${REPO_NAME}/${SCAN_TS}"
      - echo "Scanning ${REPO_OWNER}/${REPO_NAME} at ${SCAN_TS}"

      # Generate outputs. Each scan is run with an explicit --output; the CLI
      # writes the report to stdout, so we redirect to files.
      - ai-surface scan . --output markdown  --governance > "$OUT_DIR/report.md"   || true
      - ai-surface scan . --output json      > "$OUT_DIR/report.json"              || true
      - ai-surface scan . --output sarif     > "$OUT_DIR/report.sarif"             || true
      - ai-surface scan . --output cyclonedx > "$OUT_DIR/ai-bom.cyclonedx.json"    || true

      # Build a browsable HTML page from the markdown report.
      - pip install markdown
      - |
        python - <<'PY'
        import os, html, datetime
        import markdown

        out_dir = os.environ["OUT_DIR"]
        owner = os.environ.get("REPO_OWNER", "")
        name = os.environ.get("REPO_NAME", "")
        ts = os.environ.get("SCAN_TS", "")

        md_path = os.path.join(out_dir, "report.md")
        try:
            with open(md_path, encoding="utf-8") as f:
                md_text = f.read()
        except FileNotFoundError:
            md_text = "_No markdown report was produced. Check the build logs._"

        body = markdown.markdown(
            md_text, extensions=["fenced_code", "tables", "sane_lists"]
        )

        page = f"""<!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AI Surface Report - {html.escape(owner)}/{html.escape(name)}</title>
          <style>
            body {{ font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
                    max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1b1b1f; line-height: 1.5; }}
            header {{ border-bottom: 2px solid #00a99d; margin-bottom: 1.5rem; padding-bottom: .75rem; }}
            h1 {{ font-size: 1.4rem; }}
            .meta {{ color: #555; font-size: .85rem; }}
            pre {{ background: #0d1117; color: #e6edf3; padding: 1rem; border-radius: 6px; overflow-x: auto; }}
            code {{ font-family: SFMono-Regular, Menlo, Consolas, monospace; }}
            table {{ border-collapse: collapse; width: 100%; }}
            th, td {{ border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }}
            .links a {{ margin-right: 1rem; }}
          </style>
        </head>
        <body>
          <header>
            <h1>AI Attack Surface Report</h1>
            <div class="meta">Repository: {html.escape(owner)}/{html.escape(name)} &middot; Scan: {html.escape(ts)} UTC</div>
            <div class="meta links">
              Evidence:
              <a href="report.json">JSON</a>
              <a href="report.sarif">SARIF</a>
              <a href="ai-bom.cyclonedx.json">CycloneDX AI-BOM</a>
              <a href="report.md">Markdown</a>
            </div>
          </header>
          <main>{body}</main>
          <footer class="meta">Generated by apisec-inc/AI-Surface via AWS CodePipeline/CodeBuild.</footer>
        </body>
        </html>
        """
        with open(os.path.join(out_dir, "index.html"), "w", encoding="utf-8") as f:
            f.write(page)
        print("Wrote", os.path.join(out_dir, "index.html"))
        PY

      # Publish to S3: timestamped (immutable history) + latest (stable URL).
      - echo "Publishing report to s3://${REPORT_BUCKET}/${PREFIX}/"
      - aws s3 cp "$OUT_DIR/" "s3://${REPORT_BUCKET}/${PREFIX}/" --recursive
      - aws s3 cp "$OUT_DIR/" "s3://${REPORT_BUCKET}/latest/${REPO_OWNER}/${REPO_NAME}/" --recursive
      - aws s3 cp "$OUT_DIR/index.html" "s3://${REPORT_BUCKET}/latest/index.html"

      # Optionally fail the build on severity, after the report is published.
      - |
        if [ "${FAIL_ON}" != "never" ]; then
          echo "Re-running scan with --fail-on ${FAIL_ON} for the build gate..."
          ai-surface scan . --fail-on "${FAIL_ON}"
        else
          echo "FAIL_ON=never; build always succeeds so the report is always available."
        fi

artifacts:
  base-directory: ai-surface-out
  files:
    - "**/*"
